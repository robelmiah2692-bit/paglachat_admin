<!-- TAB 6: CHAT MANAGEMENT (Updated Layout) -->
<div id="tab-chat" class="tab-content hidden space-y-4">
    <div class="flex h-[70vh] bg-gray-900 border border-purple-700 rounded-xl overflow-hidden">
        
        <!-- Chat List Side (বাম পাশ) -->
        <div class="w-1/3 border-r border-purple-700 overflow-y-auto bg-gray-950/50" id="chat-list">
            <p class="p-4 text-gray-400 text-sm">Loading chats...</p>
        </div>
        
        <!-- Active Chat Window (ডান পাশ) -->
        <div class="w-2/3 flex flex-col bg-gray-950 relative">
            
            <!-- Messages Display & Input Container (চ্যাটজিপিটি স্টাইল: মেসেজ এবং ইনপুট একই স্ক্রলে বা ঠিক নিচেই ফ্লো করবে) -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
                <p class="text-gray-500 text-center my-auto text-sm">কোনো চ্যাট সিলেক্ট করুন রিপ্লাই দেওয়ার জন্য।</p>
            </div>
            
            <!-- Input Box: এটি এখন ফিক্সড নয়, চ্যাটের ঠিক নিಚেই মেসেজের সাথে থাকবে -->
            <div id="chat-input-container" class="p-4 border-t border-purple-700 flex space-x-2 bg-gray-900 hidden">
                <input type="text" id="admin-reply-input" class="flex-1 bg-gray-800 border border-purple-600 rounded-lg p-2 text-white text-sm focus:outline-none focus:border-yellow-500" placeholder="রিপ্লাই লিখুন...">
                <button onclick="sendAdminReply()" class="bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-600 hover:to-yellow-700 text-gray-950 font-bold px-6 py-2 rounded-lg transition text-sm">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
    let activeChatId = "";
    let activeUserId = "";

    // চ্যাট লিস্ট লোড করার ফাংশন
    function loadChatThreads() {
        const list = document.getElementById('chat-list');
        db.collection("chats")
          .orderBy("lastMessageTimestamp", "desc")
          .onSnapshot(snapshot => {
            list.innerHTML = "";
            if (snapshot.empty) {
                list.innerHTML = `<p class="p-4 text-gray-400 text-sm">কোনো চ্যাট পাওয়া যায়নি।</p>`;
                return;
            }
            
            let foundChat = false;
            snapshot.forEach(doc => {
                if (doc.id.includes("paglachat_official")) {
                    foundChat = true;
                    const data = doc.data();
                    const userId = doc.id.replace("paglachat_official_", "").replace("_paglachat_official", "");
                    
                    list.innerHTML += `
                        <div onclick="openChat('${doc.id}', '${userId}')" class="p-4 border-b border-purple-800 hover:bg-purple-900 cursor-pointer transition">
                            <h4 class="text-white font-bold text-sm">User ID: ${userId}</h4>
                            <p class="text-gray-400 text-xs truncate">${data.lastMessage || ''}</p>
                        </div>
                    `;
                }
            });

            if (!foundChat) {
                list.innerHTML = `<p class="p-4 text-gray-400 text-sm">কোনো অফিশিয়াল চ্যাট নেই।</p>`;
            }
        }, err => {
            list.innerHTML = `<p class="p-4 text-red-400 text-sm">Error: ${err.message}</p>`;
        });
    }

    // নির্দিষ্ট চ্যাট ওপেন করা এবং ইনপুট বক্স দৃশ্যমান করা
    function openChat(chatId, userId) {
        activeChatId = chatId;
        activeUserId = userId;
        const msgDiv = document.getElementById('chat-messages');
        const inputContainer = document.getElementById('chat-input-container');
        
        if (!msgDiv) return;

        // চ্যাট সিলেক্ট করলেই ইনপুট বক্সটি শো করবে
        inputContainer.classList.remove('hidden');
        msgDiv.innerHTML = "<p class='text-gray-400 text-center my-auto text-sm'>Loading messages...</p>";

        db.collection("chats").doc(chatId).collection("messages")
          .orderBy("timestamp", "asc")
          .onSnapshot(snapshot => {
            msgDiv.innerHTML = "";
            if (snapshot.empty) {
                msgDiv.innerHTML = "<p class='text-gray-500 text-center my-auto text-sm'>এই চ্যাটে কোনো মেসেজ নেই।</p>";
                return;
            }
            snapshot.forEach(doc => {
                const m = doc.data();
                const isMine = m.senderId === "paglachat_official";
                msgDiv.innerHTML += `
                    <div class="${isMine ? 'text-right' : 'text-left'} w-full">
                        <div class="inline-block px-4 py-2 rounded-lg text-sm mt-1 max-w-[80%] ${isMine ? 'bg-gradient-to-r from-yellow-500 to-yellow-600 text-gray-950 font-medium' : 'bg-purple-800 text-white'}">
                            ${m.message}
                        </div>
                    </div>
                `;
            });
            // একদম শেষের মেসেজের নিচে স্ক্রল ফোকাস রাখবে
            msgDiv.scrollTop = msgDiv.scrollHeight;
        });
    }

    // অ্যাডমিন হিসেবে নির্দিষ্ট ইউজারকে রিপ্লাই পাঠানো
    function sendAdminReply() {
        const inputField = document.getElementById('admin-reply-input');
        const text = inputField.value.trim();
        if (!activeChatId || !activeUserId || !text) return;

        db.collection("chats").doc(activeChatId).collection("messages").add({
            senderId: "paglachat_official",
            receiverId: activeUserId,
            message: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        db.collection("chats").doc(activeChatId).update({
            lastMessage: text,
            lastMessageTimestamp: firebase.firestore.FieldValue.serverTimestamp(),
            [`unReadCount_${activeUserId}`]: firebase.firestore.FieldValue.increment(1)
        });

        inputField.value = "";
    }
</script>
