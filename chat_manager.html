<!-- TAB 6: CHAT MANAGEMENT -->
<div id="tab-chat" class="tab-content hidden space-y-4">
    <div class="flex h-[75vh] bg-gray-900 border border-purple-700 rounded-xl overflow-hidden shadow-2xl">
        
        <!-- চ্যাট লিস্ট (বাম পাশ) -->
        <div class="w-1/3 border-r border-purple-700 overflow-y-auto bg-gray-950/50" id="chat-list">
            <p class="p-4 text-gray-400 text-sm">Loading chats...</p>
        </div>
        
        <!-- চ্যাট উইন্ডো (ডান পাশ - ন্যাচারাল স্ক্রোল) -->
        <div class="w-2/3 bg-gray-950 overflow-y-auto p-4 relative" id="chat-pane-wrapper">
            
            <!-- ডিফল্ট মেসেজ (চ্যাট সিলেক্ট না করলে দেখাবে) -->
            <div id="chat-placeholder" class="flex items-center justify-center h-full text-gray-500 text-sm">
                কোনো ইউজারের আইডি ক্লিক করুন চ্যাট ও রিপ্লাই দেওয়ার জন্য।
            </div>

            <!-- সিলেক্টেড ইউজারের চ্যাট কন্টেইনার (শুরুতে hidden থাকবে) -->
            <div id="active-chat-content" class="hidden">
                <!-- চ্যাট হেডার -->
                <div class="text-yellow-500 font-bold text-sm border-b border-purple-800 pb-2 mb-3 sticky top-0 bg-gray-950 z-10" id="chat-header-title">
                    Chat
                </div>
                
                <!-- মেসেজগুলো এখানে সিকোয়েন্স অনুযায়ী থাকবে -->
                <div id="chat-messages" class="space-y-3 mb-4 flex flex-col"></div>
                
                <!-- ইনপুট বক্স: ঠিক লাস্ট মেসেজের নিচেই থাকবে -->
                <div id="chat-input-container" class="border border-purple-700 bg-gray-900 p-3 rounded-lg flex space-x-2 mt-4">
                    <input type="text" id="admin-reply-input" class="flex-1 bg-gray-800 border border-purple-600 rounded-lg p-2 text-white text-sm focus:outline-none focus:border-yellow-500" placeholder="রিপ্লাই লিখুন...">
                    <button onclick="sendAdminReply()" class="bg-gradient-to-r from-yellow-500 to-yellow-600 text-gray-950 font-bold px-5 py-2 rounded-lg text-sm transition">Send</button>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script>
    let activeChatId = "";
    let activeUserId = "";

    // পেজ লোড হওয়ার সাথেই বা চ্যাট ট্যাব ওপেন হলে চ্যাট লিস্ট লোড করার ফাংশন কল করতে হবে
    document.addEventListener("DOMContentLoaded", () => {
        loadChatThreads();
    });

    // অথবা আপনার যদি ট্যাব পরিবর্তনের কোনো ফাংশন থাকে (যেমন switchTab), সেখানেও loadChatThreads() কল করে দেবেন।

    // চ্যাট লিস্ট লোড করার ফাংশন
    function loadChatThreads() {
        const list = document.getElementById('chat-list');
        if (!list) return;

        db.collection("chats")
          .orderBy("lastMessageTimestamp", "desc")
          .onSnapshot(snapshot => {
            list.innerHTML = "";
            if (snapshot.empty) {
                list.innerHTML = `<p class="p-4 text-gray-400 text-sm">কোনো চ্যাট পাওয়া যায়নি।</p>`;
                return;
            }
            snapshot.forEach(doc => {
                if (doc.id.includes("paglachat_official")) {
                    const data = doc.data();
                    const userId = doc.id.replace("paglachat_official_", "").replace("_paglachat_official", "");
                    list.innerHTML += `
                        <div onclick="openChat('${doc.id}', '${userId}')" class="p-4 border-b border-purple-800 hover:bg-purple-900 cursor-pointer transition">
                            <h4 class="text-white font-bold text-sm">User ID: ${userId}</h4>
                            <p class="text-gray-400 text-xs truncate">${data.lastMessage || ''}</p>
                        </div>
                    `;
                }
            });
        }, err => {
            list.innerHTML = `<p class="p-4 text-red-400 text-sm">Error: ${err.message}</p>`;
        });
    }

    // নির্দিষ্ট চ্যাট ওপেন করা এবং চ্যাট বক্স/ইনপুট বক্স দৃশ্যমান করা
    function openChat(chatId, userId) {
        activeChatId = chatId;
        activeUserId = userId;
        
        // প্লেসহোল্ডার লুকিয়ে মেইন চ্যাট কন্টেইনার এবং ইনপুট বক্স দৃশ্যমান করা
        document.getElementById('chat-placeholder').classList.add('hidden');
        document.getElementById('active-chat-content').classList.remove('hidden');
        
        document.getElementById('chat-header-title').innerText = `User ID: ${userId} - Live Chat`;
        
        const msgDiv = document.getElementById('chat-messages');
        msgDiv.innerHTML = "<p class='text-gray-400 text-center text-sm py-4'>Loading messages...</p>";

        db.collection("chats").doc(chatId).collection("messages")
          .orderBy("timestamp", "asc")
          .onSnapshot(snapshot => {
            msgDiv.innerHTML = "";
            if (snapshot.empty) {
                msgDiv.innerHTML = "<p class='text-gray-500 text-center text-sm py-4'>এই চ্যাটে কোনো মেসেজ নেই।</p>";
            } else {
                snapshot.forEach(doc => {
                    const m = doc.data();
                    const isMine = m.senderId === "paglachat_official";
                    msgDiv.innerHTML += `
                        <div class="${isMine ? 'text-right' : 'text-left'} w-full">
                            <div class="inline-block px-4 py-2 rounded-lg text-sm my-1 max-w-[80%] ${isMine ? 'bg-gradient-to-r from-yellow-500 to-yellow-600 text-gray-950 font-medium' : 'bg-purple-800 text-white'}">
                                ${m.message}
                            </div>
                        </div>
                    `;
                });
            }
            // প্যানেল স্ক্রল করে একদম নিচে ইনপুট বক্স পর্যন্ত নিয়ে যাওয়া
            const pane = document.getElementById('chat-pane-wrapper');
            pane.scrollTop = pane.scrollHeight;
        });
    }

    // অ্যাডমিন হিসেবে রিপ্লাই পাঠানো
    function sendAdminReply() {
        const inputField = document.getElementById('admin-reply-input');
        const text = inputField.value.trim();
        if (!activeChatId || !activeUserId || !text) return;

        db.collection("chats").doc(activeChatId).collection("messages").add({
            senderId: "paglachat_official",
            receiverId: activeUserId,
            message: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        db.collection("chats").doc(activeChatId).update({
            lastMessage: text,
            lastMessageTimestamp: firebase.firestore.FieldValue.serverTimestamp(),
            [`unReadCount_${activeUserId}`]: firebase.firestore.FieldValue.increment(1)
        });

        inputField.value = "";
    }
</script>
