<!-- TAB 6: CHAT MANAGEMENT (Forced Working Mini Chat Window) -->
<div id="tab-chat" class="tab-content hidden space-y-4">
    
    <!-- ১. সম্পূর্ণ স্বাধীন ইউজার লিস্ট উইন্ডো -->
    <div class="bg-gray-900 border border-purple-700 rounded-xl overflow-hidden shadow-2xl p-4">
        <h3 class="text-yellow-500 font-bold text-base mb-3 border-b border-purple-800 pb-2">ইউজার চ্যাট লিস্ট</h3>
        <div class="overflow-y-auto max-h-[500px] space-y-2" id="chat-list">
            <p class="p-4 text-gray-400 text-sm">Loading chats...</p>
        </div>
    </div>

    <!-- ২. একদম ছোট, আলাদা ভাসমান মিনি চ্যাট বক্স (সরাসরি style="display: none;" দেওয়া হয়েছে) -->
    <div id="mini-chat-modal" style="display: none;" class="fixed bottom-6 right-6 w-72 sm:w-80 h-[380px] bg-gray-950 border-2 border-yellow-500 rounded-xl shadow-2xl flex-col z-50 overflow-hidden">
        
        <!-- মিনি চ্যাট হেডার -->
        <div class="bg-gray-900 border-b border-purple-700 p-2.5 flex justify-between items-center flex-shrink-0">
            <h4 id="chat-header-title" class="text-yellow-500 font-bold text-xs sm:text-sm truncate">Chat Room</h4>
            <button onclick="closeMiniChat()" class="text-gray-400 hover:text-red-400 font-bold text-base px-2 cursor-pointer">&times;</button>
        </div>
        
        <!-- মেসেজ এরিয়া: ইউজারের মেসেজগুলো এখানে দেখাবে এবং স্ক্রোল হবে -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-3 space-y-2 flex flex-col bg-gray-950 text-xs sm:text-sm">
            <p class="text-gray-500 text-center my-auto">মেসেজ লোড হচ্ছে...</p>
        </div>
        
        <!-- ইনপুট বক্স: এটি সবসময় এই ছোট উইন্ডোর একদম নিচেই আটকে থাকবে -->
        <div class="p-2 border-t border-purple-700 bg-gray-900 flex space-x-1.5 flex-shrink-0">
            <input type="text" id="admin-reply-input" class="flex-1 bg-gray-800 border border-purple-600 rounded-lg px-2.5 py-1.5 text-white text-xs focus:outline-none focus:border-yellow-500" placeholder="রিপ্লাই লিখুন...">
            <button onclick="sendAdminReply()" class="bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-600 hover:to-yellow-700 text-gray-950 font-bold px-3 py-1.5 rounded-lg transition text-xs shadow-md cursor-pointer">Send</button>
        </div>

    </div>
</div>

<script>
    let activeChatId = "";
    let activeUserId = "";

    document.addEventListener("DOMContentLoaded", () => {
        loadChatThreads();
    });

    // চ্যাট লিস্ট লোড করার ফাংশন
    function loadChatThreads() {
        const list = document.getElementById('chat-list');
        if (!list) return;

        db.collection("chats")
          .onSnapshot(snapshot => {
            list.innerHTML = "";
            if (snapshot.empty) {
                list.innerHTML = `<p class="p-4 text-gray-400 text-sm">কোনো চ্যাট পাওয়া যায়নি।</p>`;
                return;
            }
            
            snapshot.forEach(doc => {
                const chatId = doc.id;
                const data = doc.data();
                const userId = chatId.replace("paglachat_official_", "").replace("_paglachat_official", "");

                list.innerHTML += `
                    <div onclick="openChat('${chatId}', '${userId}')" class="p-3 bg-gray-950 border border-purple-900/60 rounded-lg hover:bg-purple-900/40 cursor-pointer transition flex justify-between items-center my-1">
                        <div>
                            <h4 class="text-white font-bold text-sm">User ID: ${userId}</h4>
                            <p class="text-gray-400 text-xs truncate mt-0.5 max-w-[200px] sm:max-w-xs">${data.lastMessage || 'কোনো মেসেজ নেই'}</p>
                        </div>
                        <span class="text-xs bg-purple-800 text-yellow-400 px-2 py-1 rounded">চ্যাট করুন</span>
                    </div>
                `;
            });
        }, err => {
            list.innerHTML = `<p class="p-4 text-red-400 text-sm">Error: ${err.message}</p>`;
        });
    }

    // ইউজার লিস্টে ক্লিক করলে সরাসরি ছোট মিনি চ্যাট বক্স পপআপ আকারে ওপেন হবে
    function openChat(chatId, userId) {
        activeChatId = chatId;
        activeUserId = userId;
        
        // ফ্লোটিং মিনি চ্যাট বক্স সরাসরি ডিসপ্লে ফ্লেক্স করে দৃশ্যমান করা হলো
        const modal = document.getElementById('mini-chat-modal');
        if (modal) {
            modal.style.display = 'flex';
        }
        
        const headerTitle = document.getElementById('chat-header-title');
        if (headerTitle) {
            headerTitle.innerText = `User ID: ${userId}`;
        }
        
        const msgDiv = document.getElementById('chat-messages');
        if (!msgDiv) return;

        msgDiv.innerHTML = "<p class='text-gray-400 text-center my-auto text-xs'>Loading messages...</p>";

        db.collection("chats").doc(chatId).collection("messages")
          .orderBy("timestamp", "asc")
          .onSnapshot(snapshot => {
            msgDiv.innerHTML = "";
            if (snapshot.empty) {
                msgDiv.innerHTML = "<p class='text-gray-500 text-center my-auto text-xs'>এই চ্যাটে কোনো মেসেজ নেই।</p>";
                return;
            }
            snapshot.forEach(doc => {
                const m = doc.data();
                const isMine = m.senderId === "paglachat_official";
                msgDiv.innerHTML += `
                    <div class="${isMine ? 'text-right' : 'text-left'} w-full">
                        <div class="inline-block px-3 py-1.5 rounded-lg text-xs my-1 max-w-[85%] ${isMine ? 'bg-gradient-to-r from-yellow-500 to-yellow-600 text-gray-950 font-medium' : 'bg-purple-800 text-white'}">
                            ${m.message || ''}
                        </div>
                    </div>
                `;
            });
            msgDiv.scrollTop = msgDiv.scrollHeight;
        });
    }

    // মিনি চ্যাট বক্স বন্ধ করার ফাংশন
    function closeMiniChat() {
        const modal = document.getElementById('mini-chat-modal');
        if (modal) {
            modal.style.display = 'none';
        }
        activeChatId = "";
        activeUserId = "";
    }

    // অ্যাডমিন হিসেবে রিপ্লাই পাঠানো
    function sendAdminReply() {
        const inputField = document.getElementById('admin-reply-input');
        if (!inputField) return;
        
        const text = inputField.value.trim();
        if (!activeChatId || !activeUserId || !text) return;

        db.collection("chats").doc(activeChatId).collection("messages").add({
            senderId: "paglachat_official",
            receiverId: activeUserId,
            message: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        db.collection("chats").doc(activeChatId).update({
            lastMessage: text,
            lastMessageTimestamp: firebase.firestore.FieldValue.serverTimestamp(),
            [`unReadCount_${activeUserId}`]: firebase.firestore.FieldValue.increment(1)
        });

        inputField.value = "";
    }
</script>
