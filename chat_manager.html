<!-- TAB 6: CHAT MANAGEMENT (Optimized Layout) -->
<div id="tab-chat" class="tab-content hidden space-y-4">
    <div class="flex h-[75vh] bg-gray-900 border border-purple-700 rounded-xl overflow-hidden shadow-2xl">
        
        <!-- চ্যাট লিস্ট -->
        <div class="w-1/3 border-r border-purple-700 overflow-y-auto bg-gray-950/50" id="chat-list">
            <!-- লিস্ট এখানে লোড হবে -->
        </div>
        
        <!-- চ্যাট এরিয়া -->
        <div class="w-2/3 flex flex-col bg-gray-950">
            <!-- মেসেজ কন্টেইনার (এটি ফ্লেক্সিবল) -->
            <div id="chat-messages-container" class="flex flex-col flex-1 overflow-hidden">
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3">
                    <!-- মেসেজগুলো এখানে থাকবে -->
                    <p class="text-gray-500 text-center text-sm pt-20">ইউজার সিলেক্ট করুন</p>
                </div>
                
                <!-- ইনপুট বক্স এখন মেসেজের ঠিক নিচে থাকবে -->
                <div id="chat-input-container" class="p-4 border-t border-purple-700 bg-gray-900 flex space-x-2 hidden">
                    <input type="text" id="admin-reply-input" class="flex-1 bg-gray-800 border border-purple-600 rounded-lg p-2 text-white text-sm focus:outline-none" placeholder="রিপ্লাই লিখুন...">
                    <button onclick="sendAdminReply()" class="bg-yellow-600 text-black font-bold px-6 py-2 rounded-lg text-sm">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // চ্যাট ওপেন করার ফাংশনে ইনপুট বক্সটি দেখানোর লজিক যোগ করা হয়েছে
    function openChat(chatId, userId) {
        activeChatId = chatId;
        activeUserId = userId;
        
        // ইনপুট বক্সটি দৃশ্যমান করা
        document.getElementById('chat-input-container').classList.remove('hidden');
        
        const msgDiv = document.getElementById('chat-messages');
        msgDiv.innerHTML = "<p class='text-gray-400 text-center text-sm'>Loading...</p>";

        db.collection("chats").doc(chatId).collection("messages")
          .orderBy("timestamp", "asc")
          .onSnapshot(snapshot => {
            msgDiv.innerHTML = "";
            snapshot.forEach(doc => {
                const m = doc.data();
                const isMine = m.senderId === "paglachat_official";
                msgDiv.innerHTML += `
                    <div class="${isMine ? 'text-right' : 'text-left'} w-full">
                        <div class="inline-block px-4 py-2 rounded-lg text-sm my-1 ${isMine ? 'bg-yellow-600 text-black' : 'bg-purple-800 text-white'}">
                            ${m.message}
                        </div>
                    </div>
                `;
            });
            // মেসেজ লোড হলে স্ক্রল একদম নিচে চলে যাবে
            msgDiv.scrollTop = msgDiv.scrollHeight;
        });
    }
</script>
