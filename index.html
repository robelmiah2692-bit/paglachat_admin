<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaglaChat Pro Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f0c1b;
            color: #e2e8f0;
        }
        .royal-gradient {
            background: linear-gradient(135deg, #2d1b4e 0%, #1a102f 100%);
        }
        .gold-border {
            border-color: #d4af37;
        }
        .gold-text {
            color: #d4af37;
        }
    </style>
</head>

<body class="min-h-screen">

    <!-- Login Section -->
    <div id="login-section" class="flex items-center justify-center min-h-screen p-4">
        <div class="max-w-md w-full royal-gradient border gold-border rounded-xl shadow-2xl p-8 text-center">
            <div class="mb-6">
                <i class="fa-solid fa-crown gold-text text-5xl mb-3"></i>
                <h1 class="text-3xl font-bold text-white">PaglaChat Owner</h1>
                <p class="text-sm text-gray-400 mt-2">অ্যাডমিন প্যানেলে প্রবেশ করতে আপনার ওনার জিমেইল দিয়ে লগইন করুন</p>
            </div>
            <button onclick="loginWithGoogle()" class="w-full bg-white text-gray-900 font-semibold py-3 px-4 rounded-lg shadow hover:bg-gray-100 transition flex items-center justify-center space-x-2">
                <i class="fa-brands fa-google text-red-500"></i>
                <span>Sign in with Google</span>
            </button>
        </div>
    </div>

    <!-- Dashboard Section (Hidden by default) -->
    <div id="dashboard-section" class="hidden flex h-screen overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <div class="w-64 royal-gradient border-r gold-border flex flex-col justify-between p-4">
            <div>
                <div class="flex items-center space-x-3 mb-8 px-2">
                    <i class="fa-solid fa-crown gold-text text-2xl"></i>
                    <span class="text-xl font-bold text-white tracking-wider">PaglaChat Admin</span>
                </div>
                <nav class="space-y-2">
                    <button onclick="switchTab('users')" id="nav-users" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg bg-purple-900 text-gold-text font-medium transition"><i class="fa-solid fa-users"></i><span>Users Data</span></button>
                    <button onclick="switchTab('rooms')" id="nav-rooms" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-purple-800 hover:text-white transition"><i class="fa-solid fa-door-open"></i><span>Live Rooms</span></button>
                    <button onclick="switchTab('blocked')" id="nav-blocked" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-purple-800 hover:text-white transition"><i class="fa-solid fa-ban"></i><span>Blocked Devices</span></button>
                    <button onclick="switchTab('recharge')" id="nav-recharge" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-purple-800 hover:text-white transition"><i class="fa-solid fa-wallet"></i><span>Recharge History</span></button>
                    <button onclick="switchTab('broadcast')" id="nav-broadcast" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-purple-800 hover:text-white transition"><i class="fa-solid fa-bullhorn"></i><span>Broadcast Message</span></button>
                </nav>
            </div>
            <div>
                <button onclick="logoutAdmin()" class="w-full flex items-center justify-center space-x-2 bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-lg transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <!-- Top Header -->
            <header class="royal-gradient border-b gold-border p-4 flex justify-between items-center shadow-md">
                <h2 id="page-title" class="text-xl font-bold text-white">Users Management</h2>
                <div class="flex items-center space-x-4">
                    <div class="bg-purple-900 border gold-text px-4 py-2 rounded-lg text-sm font-semibold shadow">
                        <i class="fa-solid fa-user-shield mr-2"></i>Live Online Users: <span id="live-user-count" class="text-white font-bold">0</span>
                    </div>
                </div>
            </header>

            <!-- Content Body -->
            <main class="p-6">

                <!-- TAB 1: USERS -->
                <div id="tab-users" class="tab-content space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="users-card-grid">
                        <!-- Dynamic User Cards will load here -->
                    </div>
                </div>

                <!-- TAB 2: ROOMS -->
                <div id="tab-rooms" class="tab-content hidden space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="rooms-card-grid">
                        <!-- Dynamic Rooms Cards will load here -->
                    </div>
                </div>

                <!-- TAB 3: BLOCKED DEVICES -->
                <div id="tab-blocked" class="tab-content hidden space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="blocked-card-grid">
                        <!-- Dynamic Blocked Devices Cards will load here -->
                    </div>
                </div>

                <!-- TAB 4: RECHARGE HISTORY -->
                <div id="tab-recharge" class="tab-content hidden space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="recharge-card-grid">
                        <!-- Dynamic Recharge History Cards will load here -->
                    </div>
                </div>

                <!-- TAB 5: BROADCAST MESSAGE -->
                <div id="tab-broadcast" class="tab-content hidden space-y-4 max-w-xl mx-auto">
                    <div class="royal-gradient border gold-border p-6 rounded-xl shadow-lg">
                        <h3 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-paper-plane mr-2 gold-text"></i>Send Announcement to All Users</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1">Message Title</label>
                                <input type="text" id="broadcast-title" class="w-full bg-gray-900 border border-purple-700 rounded-lg p-3 text-white focus:outline-none focus:border-gold-text" placeholder="যেমন: জরুরি নোটিশ!">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1">Message Body</label>
                                <textarea id="broadcast-body" rows="4" class="w-full bg-gray-900 border border-purple-700 rounded-lg p-3 text-white focus:outline-none focus:border-gold-text" placeholder="সকল ইউজারদের জন্য মেসেজ লিখুন..."></textarea>
                            </div>
                            <button onclick="sendBroadcast()" class="w-full bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-600 hover:to-yellow-700 text-gray-950 font-bold py-3 rounded-lg shadow transition">
                                Send to All Users
                            </button>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9KMdtIBNVYSASc5C2w5JGVTL-NISXFog",
            authDomain: "paglachat.firebaseapp.com",
            projectId: "paglachat",
            storageBucket: "paglachat.firebasestorage.app",
            messagingSenderId: "25052070011",
            appId: "1:25052070011:web:7c447f8d011fbdf3d662de"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const OWNER_EMAIL = "robelmiah2692@gmail.com";

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                if (result.user.email === OWNER_EMAIL) {
                    checkAdminAccess();
                } else {
                    alert("Access Denied! You are not the owner.");
                    auth.signOut();
                }
            }).catch((error) => alert(error.message));
        }

        function checkAdminAccess() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            loadAllDataRealtime();
        }

        function logoutAdmin() {
            auth.signOut().then(() => {
                document.getElementById('dashboard-section').classList.add('hidden');
                document.getElementById('login-section').classList.remove('hidden');
            });
        }

        // Tab Switching Logic
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('bg-purple-900', 'text-gold-text');
                btn.classList.add('text-gray-300');
            });
            document.getElementById(`nav-${tabName}`).classList.add('bg-purple-900', 'text-gold-text');
            document.getElementById(`nav-${tabName}`).classList.remove('text-gray-300');

            const titles = {
                'users': 'Users Management & Full Data',
                'rooms': 'Live Rooms Data',
                'blocked': 'Blocked Devices Control',
                'recharge': 'Recharge History Log',
                'broadcast': 'Broadcast Message System'
            };
            document.getElementById('page-title').innerText = titles[tabName];
        }

        // Realtime Data Loading Function
        function loadAllDataRealtime() {
            // 1. Users & Online Count Realtime
            db.collection("users").onSnapshot((snapshot) => {
                const grid = document.getElementById('users-card-grid');
                grid.innerHTML = "";
                let onlineCount = 0;

                snapshot.forEach((doc) => {
                    const u = doc.data();
                    if (u.isOnline === true) onlineCount++;

                    const card = `
                        <div class="royal-gradient border gold-border rounded-xl p-4 shadow-md flex flex-col justify-between">
                            <div>
                                <div class="flex items-center space-x-3 mb-3">
                                    <img src="${u.profilePic || 'https://via.placeholder.com/50'}" class="w-12 h-12 rounded-full border-2 gold-border object-cover">
                                    <div>
                                        <h4 class="font-bold text-white text-base">${u.name || 'No Name'}</h4>
                                        <span class="text-xs px-2 py-0.5 rounded ${u.isOnline ? 'bg-green-600 text-white' : 'bg-gray-600 text-gray-300'}">${u.isOnline ? 'Online' : 'Offline'}</span>
                                    </div>
                                </div>
                                <div class="text-xs space-y-1 text-gray-300 bg-gray-900/50 p-2.5 rounded-lg border border-purple-800">
                                    <p><strong class="gold-text">Email:</strong> ${u.email || 'N/A'}</p>
                                    <p><strong class="gold-text">uiD:</strong> ${u.uiD || doc.id}</p>
                                    <p><strong class="gold-text">uid:</strong> ${u.uid || 'N/A'}</p>
                                    <p><strong class="gold-text">authUID:</strong> ${u.authUID || 'N/A'}</p>
                                    <p><strong class="gold-text">Diamonds:</strong> 💎 ${u.diamonds || 0}</p>
                                    <p><strong class="gold-text">Device ID:</strong> ${u.deviceId || 'N/A'}</p>
                                </div>
                            </div>
                            <div class="mt-4 flex space-x-2">
                                <button onclick="blockDevice('${u.deviceId}')" class="flex-1 bg-yellow-600 hover:bg-yellow-700 text-gray-950 font-semibold py-1.5 rounded text-xs transition">Block Device</button>
                                <button onclick="deleteUser('${doc.id}')" class="bg-red-600 hover:bg-red-700 text-white py-1.5 px-3 rounded text-xs transition"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
                document.getElementById('live-user-count').innerText = onlineCount;
            });

            // 2. Rooms Realtime
            db.collection("rooms").onSnapshot((snapshot) => {
                const grid = document.getElementById('rooms-card-grid');
                grid.innerHTML = "";
                snapshot.forEach((doc) => {
                    const r = doc.data();
                    const card = `
                        <div class="royal-gradient border gold-border rounded-xl p-4 shadow-md">
                            <div class="flex justify-between items-center mb-2">
                                <h4 class="font-bold text-white text-base">Room ID: ${doc.id}</h4>
                                <span class="text-xs px-2 py-0.5 rounded ${r.isLive ? 'bg-green-600 text-white' : 'bg-red-600 text-white'}">${r.isLive ? 'Live' : 'Inactive'}</span>
                            </div>
                            <div class="text-xs space-y-1 text-gray-300 bg-gray-900/50 p-2.5 rounded-lg border border-purple-800">
                                <p><strong class="gold-text">Daily Points:</strong> ${r.dailyPoints || 0}</p>
                                <p><strong class="gold-text">Entry ID:</strong> ${r.lastEntry?.entryId || 'N/A'}</p>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            });

            // 3. Blocked Devices Realtime
            db.collection("blocked_devices").onSnapshot((snapshot) => {
                const grid = document.getElementById('blocked-card-grid');
                grid.innerHTML = "";
                snapshot.forEach((doc) => {
                    const b = doc.data();
                    const card = `
                        <div class="royal-gradient border border-red-800 rounded-xl p-4 shadow-md flex flex-col justify-between">
                            <div>
                                <h4 class="font-bold text-red-400 text-base mb-2"><i class="fa-solid fa-ban mr-2"></i>Blocked Device</h4>
                                <p class="text-xs text-gray-300 bg-gray-900/50 p-2.5 rounded-lg border border-red-900 break-all">
                                    <strong class="text-white">Device ID:</strong> ${doc.id}
                                </p>
                            </div>
                            <div class="mt-4">
                                <button onclick="unblockDevice('${doc.id}')" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-1.5 rounded text-xs transition">Unblock Device</button>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            });

            // 4. Recharge History Realtime
            db.collection("diamond_history").onSnapshot((snapshot) => {
                const grid = document.getElementById('recharge-card-grid');
                grid.innerHTML = "";
                snapshot.forEach((doc) => {
                    const d = doc.data();
                    const card = `
                        <div class="royal-gradient border gold-border rounded-xl p-4 shadow-md">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-semibold gold-text">Type: ${d.type || 'N/A'}</span>
                                <span class="text-xs bg-purple-900 text-white px-2 py-0.5 rounded">💎 ${d.amount || 0}</span>
                            </div>
                            <div class="text-xs space-y-1 text-gray-300 bg-gray-900/50 p-2.5 rounded-lg border border-purple-800">
                                <p><strong class="gold-text">Sender ID:</strong> ${d.senderId || 'N/A'}</p>
                                <p><strong class="gold-text">Receiver:</strong> ${d.receiverName || 'N/A'} (${d.receiverId || ''})</p>
                                <p><strong class="gold-text">Earned XP:</strong> ${d.earnedXP || 0}</p>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            });
        }

        // Actions Control
        function deleteUser(userId) {
            if (confirm("Are you sure you want to delete this user?")) {
                db.collection("users").doc(userId).delete().then(() => alert("User deleted successfully!"));
            }
        }

        function blockDevice(deviceId) {
            if (!deviceId || deviceId === 'N/A') {
                alert("Invalid Device ID!");
                return;
            }
            if (confirm("Are you sure you want to block this device?")) {
                db.collection("blocked_devices").doc(deviceId).set({
                    blocked_devices: deviceId,
                    blockedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => alert("Device Blocked Successfully!"));
            }
        }

        function unblockDevice(deviceId) {
            if (confirm("Are you sure you want to unblock this device?")) {
                db.collection("blocked_devices").doc(deviceId).delete().then(() => alert("Device Unblocked Successfully!"));
            }
        }

        function sendBroadcast() {
            const title = document.getElementById('broadcast-title').value;
            const body = document.getElementById('broadcast-body').value;

            if (!title || !body) {
                alert("Please fill in both title and body!");
                return;
            }

            if (confirm("Are you sure you want to send this message to all users?")) {
                db.collection("notifications").add({
                    title: title,
                    body: body,
                    type: "broadcast",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    alert("Broadcast message sent successfully!");
                    document.getElementById('broadcast-title').value = "";
                    document.getElementById('broadcast-body').value = "";
                }).catch(err => alert("Error: " + err.message));
            }
        }
    </script>
</body>

</html>
